- inputText:
    text: "Test To Do Item 1"

- tapOn: "Return"

- assertVisible: "Test To Do Item 1"
- assertVisible:
    id: "completeButton-0"
- tapOn:
    id: "completeButton-0"

- tapOn: "To Do Item"

- inputText:
    text: "Test To Do Item 2"

- tapOn: "Return"

- assertVisible: "Test To Do Item 2"

- assertVisible:
    id: "selection-Shopping List"
- tapOn:
    id: "selection-Shopping List"

- assertVisible:
    id: "newShoppingItem"
- tapOn:
    id: "newShoppingItem"

- inputText:
    text: "Test Shopping Item 1"

- tapOn: "Return"

- assertVisible: "Test Shopping Item 1"

- assertVisible:
    id: "completeButton-0"
- tapOn:
    id: "completeButton-0"

